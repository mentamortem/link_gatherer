repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: elastic
    url: https://helm.elastic.co

releases:
  - name: postgresql
    namespace: default
    chart: bitnami/postgresql
    values:
      - ./deps/postgresql/values.yaml

  - name: redis
    namespace: default
    chart: bitnami/redis
    values:
      - ./deps/redis/values.yaml

  - name: kafka
    namespace: default
    chart: bitnami/kafka
    values:
      - ./deps/kafka/values.yaml

  - name: elastic
    namespace: default
    chart: elastic/elasticsearch
    values:
      - ./deps/elastic/values.yaml
  - name: link-collector
    namespace: default
    chart: ./collector
    values:
      - ./collector/values.yaml
